name: Build releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pygame pyinstaller pillow
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Pinesweeper-${{ matrix.os }}
          path: release/*.zip

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pygbag
      - run: python build_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: Pinesweeper-web
          path: release/Pinesweeper-web.zip
